<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RL Experiment Dashboard</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6fa;
        --panel: #ffffff;
        --line: #d9e0ea;
        --text: #172033;
        --muted: #647189;
        --accent: #1666c1;
        --accent-soft: #e7f0fb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        padding: 18px 28px;
      }
      h1 {
        font-size: 22px;
        margin: 0;
      }
      main {
        display: grid;
        grid-template-columns: minmax(420px, 0.95fr) minmax(420px, 1.05fr);
        gap: 18px;
        padding: 18px;
      }
      section {
        min-width: 0;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 8px;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }
      h2 {
        font-size: 15px;
        margin: 0;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      th,
      td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      th {
        color: var(--muted);
        font-weight: 600;
        background: #f8fafd;
      }
      tr[data-run-id] {
        cursor: pointer;
      }
      tr[data-run-id]:hover {
        background: var(--accent-soft);
      }
      .detail {
        padding: 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .field {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
      }
      .label {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 4px;
      }
      .value {
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .subhead {
        margin: 18px 0 8px;
        font-size: 14px;
      }
      .empty {
        color: var(--muted);
        padding: 16px;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--accent);
        cursor: pointer;
        font-size: 13px;
        padding: 7px 10px;
      }
      button:hover {
        border-color: var(--accent);
      }
      @media (max-width: 920px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>RL Experiment Dashboard</h1>
      <div class="muted">Local run index, metric summaries, checkpoints, and lineage.</div>
    </header>

    <main>
      <section>
        <div class="section-head">
          <h2>Runs</h2>
          <button type="button" id="refresh-runs">Refresh</button>
        </div>
        <table id="run-table" aria-label="Indexed runs">
          <thead>
            <tr>
              <th>Run</th>
              <th>Project</th>
              <th>Latest Checkpoint</th>
              <th>Modified</th>
            </tr>
          </thead>
          <tbody id="run-table-body">
            <tr>
              <td colspan="4" class="empty">Loading runs...</td>
            </tr>
          </tbody>
        </table>
      </section>

      <section>
        <div class="section-head">
          <h2>Run Detail</h2>
          <span id="selected-run" class="muted">No run selected</span>
        </div>
        <div id="run-detail" class="detail">
          <div class="empty">Select a run to inspect metrics, checkpoints, and lineage.</div>
        </div>
      </section>
    </main>

    <script>
      const runTableBody = document.getElementById('run-table-body');
      const runDetail = document.getElementById('run-detail');
      const selectedRun = document.getElementById('selected-run');
      document.getElementById('refresh-runs').addEventListener('click', loadRuns);

      async function loadRuns() {
        runTableBody.innerHTML = `<tr><td colspan="4" class="empty">Loading runs...</td></tr>`;
        const response = await fetch('/api/runs');
        const payload = await response.json();
        renderRuns(payload.runs || []);
      }

      function renderRuns(runs) {
        if (runs.length === 0) {
          runTableBody.innerHTML = `<tr><td colspan="4" class="empty">No indexed runs yet.</td></tr>`;
          return;
        }
        runTableBody.innerHTML = runs
          .map(
            (run) => `
              <tr data-run-id="${escapeHtml(run.run_id)}">
                <td>${escapeHtml(run.run_id)}</td>
                <td>${escapeHtml(run.project_name || '')}</td>
                <td>${escapeHtml(run.latest_checkpoint || '')}</td>
                <td>${formatTimestamp(run.modified_time)}</td>
              </tr>
            `,
          )
          .join('');
        for (const row of runTableBody.querySelectorAll('tr[data-run-id]')) {
          row.addEventListener('click', () => loadRunDetail(row.dataset.runId));
        }
      }

      async function loadRunDetail(runId) {
        selectedRun.textContent = runId;
        runDetail.innerHTML = `<div class="empty">Loading detail...</div>`;
        const response = await fetch(`/api/run-detail?run_id=${encodeURIComponent(runId)}`);
        const payload = await response.json();
        renderRunDetail(payload);
      }

      function renderRunDetail(payload) {
        if (!payload.run) {
          runDetail.innerHTML = `<div class="empty">Run not found.</div>`;
          return;
        }
        const run = payload.run;
        runDetail.innerHTML = `
          <div class="grid">
            ${field('Run ID', run.run_id)}
            ${field('Group', run.group)}
            ${field('Path', run.path)}
            ${field('Latest Checkpoint', run.latest_checkpoint || '')}
          </div>

          <h3 class="subhead">Metric Summaries</h3>
          ${metricTable(payload.metrics || [])}

          <h3 class="subhead">Checkpoints</h3>
          ${checkpointTable(payload.checkpoints || [])}

          <h3 class="subhead">Lineage</h3>
          ${lineageTable(payload.parent_lineage || [], payload.child_lineage || [])}
        `;
      }

      function field(label, value) {
        return `
          <div class="field">
            <div class="label">${escapeHtml(label)}</div>
            <div class="value">${escapeHtml(String(value || ''))}</div>
          </div>
        `;
      }

      function metricTable(metrics) {
        if (metrics.length === 0) return `<div class="empty">No metrics indexed for this run.</div>`;
        return `
          <table>
            <thead>
              <tr>
                <th>Tag</th>
                <th>Last</th>
                <th>Step</th>
                <th>Mean1000</th>
              </tr>
            </thead>
            <tbody>
              ${metrics
                .map(
                  (metric) => `
                    <tr>
                      <td>${escapeHtml(metric.tag)}</td>
                      <td>${formatNumber(metric.last_value)}</td>
                      <td>${metric.last_step}</td>
                      <td>${formatNumber(metric.window_means?.mean1000)}</td>
                    </tr>
                  `,
                )
                .join('')}
            </tbody>
          </table>
        `;
      }

      function checkpointTable(checkpoints) {
        if (checkpoints.length === 0) return `<div class="empty">No checkpoints indexed for this run.</div>`;
        return `
          <table>
            <thead><tr><th>Checkpoint</th><th>Iteration</th><th>Latest</th></tr></thead>
            <tbody>
              ${checkpoints
                .map(
                  (checkpoint) => `
                    <tr>
                      <td>${escapeHtml(checkpoint.path.split('/').pop())}</td>
                      <td>${checkpoint.iteration ?? ''}</td>
                      <td>${checkpoint.is_latest ? 'yes' : ''}</td>
                    </tr>
                  `,
                )
                .join('')}
            </tbody>
          </table>
        `;
      }

      function lineageTable(parents, children) {
        const rows = [
          ...parents.map((edge) => ['parent', edge.parent_run_id, edge.relationship, edge.intended_change]),
          ...children.map((edge) => ['child', edge.child_run_id, edge.relationship, edge.intended_change]),
        ];
        if (rows.length === 0) return `<div class="empty">No lineage links recorded.</div>`;
        return `
          <table>
            <thead><tr><th>Direction</th><th>Run</th><th>Type</th><th>Change</th></tr></thead>
            <tbody>
              ${rows
                .map(
                  ([direction, runId, type, change]) => `
                    <tr>
                      <td>${escapeHtml(direction)}</td>
                      <td>${escapeHtml(runId)}</td>
                      <td>${escapeHtml(type)}</td>
                      <td>${escapeHtml(change || '')}</td>
                    </tr>
                  `,
                )
                .join('')}
            </tbody>
          </table>
        `;
      }

      function formatTimestamp(value) {
        if (!value) return '';
        return new Date(value * 1000).toLocaleString();
      }

      function formatNumber(value) {
        if (value === null || value === undefined) return '';
        return Number(value).toPrecision(5);
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      loadRuns().catch((error) => {
        runTableBody.innerHTML = `<tr><td colspan="4" class="empty">${escapeHtml(error.message)}</td></tr>`;
      });
    </script>
  </body>
</html>
