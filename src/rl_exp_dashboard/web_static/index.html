<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RL Experiment Dashboard</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6fa;
        --panel: #ffffff;
        --line: #d9e0ea;
        --text: #172033;
        --muted: #647189;
        --accent: #1666c1;
        --accent-soft: #e7f0fb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        padding: 18px 28px;
      }
      h1 {
        font-size: 22px;
        margin: 0;
      }
      main {
        display: grid;
        grid-template-columns: minmax(420px, 0.95fr) minmax(420px, 1.05fr);
        gap: 18px;
        padding: 18px;
      }
      section {
        min-width: 0;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 8px;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }
      h2 {
        font-size: 15px;
        margin: 0;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      th,
      td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      th {
        color: var(--muted);
        font-weight: 600;
        background: #f8fafd;
      }
      tr[data-run-id] {
        cursor: pointer;
      }
      tr[data-run-id]:hover {
        background: var(--accent-soft);
      }
      .detail {
        padding: 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .field {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
      }
      .label {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 4px;
      }
      .value {
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .subhead {
        margin: 18px 0 8px;
        font-size: 14px;
      }
      .empty {
        color: var(--muted);
        padding: 16px;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--accent);
        cursor: pointer;
        font-size: 13px;
        padding: 7px 10px;
      }
      button:hover {
        border-color: var(--accent);
      }
      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
        font-size: 13px;
        padding: 8px;
      }
      textarea {
        min-height: 72px;
        resize: vertical;
      }
      .form-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 10px;
      }
      .form-actions {
        display: flex;
        justify-content: flex-end;
      }
      @media (max-width: 920px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>RL Experiment Dashboard</h1>
      <div class="muted">Local run index, metric summaries, checkpoints, and lineage.</div>
    </header>

    <main>
      <section>
        <div class="section-head">
          <h2>Runs</h2>
          <button type="button" id="refresh-runs">Refresh</button>
        </div>
        <table id="run-table" aria-label="Indexed runs">
          <thead>
            <tr>
              <th>Run</th>
              <th>Project</th>
              <th>Latest Checkpoint</th>
              <th>Modified</th>
            </tr>
          </thead>
          <tbody id="run-table-body">
            <tr>
              <td colspan="4" class="empty">Loading runs...</td>
            </tr>
          </tbody>
        </table>
      </section>

      <section>
        <div class="section-head">
          <h2>Run Detail</h2>
          <span id="selected-run" class="muted">No run selected</span>
        </div>
        <div id="run-detail" class="detail">
          <div class="empty">Select a run to inspect metrics, checkpoints, and lineage.</div>
        </div>
      </section>
    </main>

    <script>
      const runTableBody = document.getElementById('run-table-body');
      const runDetail = document.getElementById('run-detail');
      const selectedRun = document.getElementById('selected-run');
      document.getElementById('refresh-runs').addEventListener('click', loadRuns);

      async function loadRuns() {
        runTableBody.innerHTML = `<tr><td colspan="4" class="empty">Loading runs...</td></tr>`;
        const response = await fetch('/api/runs');
        const payload = await response.json();
        renderRuns(payload.runs || []);
      }

      function renderRuns(runs) {
        if (runs.length === 0) {
          runTableBody.innerHTML = `<tr><td colspan="4" class="empty">No indexed runs yet.</td></tr>`;
          return;
        }
        runTableBody.innerHTML = runs
          .map(
            (run) => `
              <tr data-run-id="${escapeHtml(run.run_id)}">
                <td>${escapeHtml(run.run_id)}</td>
                <td>${escapeHtml(run.project_name || '')}</td>
                <td>${escapeHtml(run.latest_checkpoint || '')}</td>
                <td>${formatTimestamp(run.modified_time)}</td>
              </tr>
            `,
          )
          .join('');
        for (const row of runTableBody.querySelectorAll('tr[data-run-id]')) {
          row.addEventListener('click', () => loadRunDetail(row.dataset.runId));
        }
      }

      async function loadRunDetail(runId) {
        selectedRun.textContent = runId;
        runDetail.innerHTML = `<div class="empty">Loading detail...</div>`;
        const response = await fetch(`/api/run-detail?run_id=${encodeURIComponent(runId)}`);
        const payload = await response.json();
        renderRunDetail(payload);
      }

      function renderRunDetail(payload) {
        if (!payload.run) {
          runDetail.innerHTML = `<div class="empty">Run not found.</div>`;
          return;
        }
        const run = payload.run;
        runDetail.innerHTML = `
          <div class="grid">
            ${field('Run ID', run.run_id)}
            ${field('Group', run.group)}
            ${field('Path', run.path)}
            ${field('Latest Checkpoint', run.latest_checkpoint || '')}
          </div>

          <h3 class="subhead">Manual Observation</h3>
          ${observationPanel(run.run_id, payload.observation)}

          <h3 class="subhead">Metric Summaries</h3>
          ${metricTable(payload.metrics || [])}

          <h3 class="subhead">Checkpoints</h3>
          ${checkpointTable(payload.checkpoints || [])}

          <h3 class="subhead">Checkpoint Reviews</h3>
          ${checkpointReviewPanel(run.run_id, payload.checkpoints || [], payload.checkpoint_reviews || [])}

          <h3 class="subhead">Lineage</h3>
          ${lineageTable(payload.parent_lineage || [], payload.child_lineage || [])}
        `;
        bindObservationForms(run.run_id);
      }

      function field(label, value) {
        return `
          <div class="field">
            <div class="label">${escapeHtml(label)}</div>
            <div class="value">${escapeHtml(String(value || ''))}</div>
          </div>
        `;
      }

      function metricTable(metrics) {
        if (metrics.length === 0) return `<div class="empty">No metrics indexed for this run.</div>`;
        return `
          <table>
            <thead>
              <tr>
                <th>Tag</th>
                <th>Last</th>
                <th>Step</th>
                <th>Mean1000</th>
              </tr>
            </thead>
            <tbody>
              ${metrics
                .map(
                  (metric) => `
                    <tr>
                      <td>${escapeHtml(metric.tag)}</td>
                      <td>${formatNumber(metric.last_value)}</td>
                      <td>${metric.last_step}</td>
                      <td>${formatNumber(metric.window_means?.mean1000)}</td>
                    </tr>
                  `,
                )
                .join('')}
            </tbody>
          </table>
        `;
      }

      function checkpointTable(checkpoints) {
        if (checkpoints.length === 0) return `<div class="empty">No checkpoints indexed for this run.</div>`;
        return `
          <table>
            <thead><tr><th>Checkpoint</th><th>Iteration</th><th>Latest</th></tr></thead>
            <tbody>
              ${checkpoints
                .map(
                  (checkpoint) => `
                    <tr>
                      <td>${escapeHtml(checkpoint.path.split('/').pop())}</td>
                      <td>${checkpoint.iteration ?? ''}</td>
                      <td>${checkpoint.is_latest ? 'yes' : ''}</td>
                    </tr>
                  `,
                )
                .join('')}
            </tbody>
          </table>
        `;
      }

      function observationPanel(runId, observation) {
        const tags = (observation?.tags || []).join(', ');
        return `
          <form id="run-observation-form">
            <div class="form-row">
              <label>
                <div class="label">Verdict</div>
                <select name="verdict">
                  ${option('unreviewed', observation?.verdict)}
                  ${option('good', observation?.verdict)}
                  ${option('mixed', observation?.verdict)}
                  ${option('bad', observation?.verdict)}
                  ${option('exported', observation?.verdict)}
                </select>
              </label>
              <label>
                <div class="label">Recommended checkpoint</div>
                <input name="recommended_checkpoint" value="${escapeHtml(observation?.recommended_checkpoint || '')}" />
              </label>
            </div>
            <label>
              <div class="label">Summary</div>
              <textarea name="summary">${escapeHtml(observation?.summary || '')}</textarea>
            </label>
            <label>
              <div class="label">Tags, comma separated</div>
              <input name="tags" value="${escapeHtml(tags)}" />
            </label>
            <div class="form-actions">
              <button type="submit">Save Observation</button>
            </div>
          </form>
        `;
      }

      function checkpointReviewPanel(runId, checkpoints, reviews) {
        const byCheckpoint = new Map(reviews.map((review) => [review.checkpoint, review]));
        const checkpointOptions = checkpoints
          .map((checkpoint) => checkpoint.path.split('/').pop())
          .filter(Boolean);
        const selected = checkpointOptions[0] || '';
        const reviewRows =
          reviews.length === 0
            ? `<div class="empty">No checkpoint reviews yet.</div>`
            : `<table>
                <thead><tr><th>Checkpoint</th><th>Status</th><th>Tags</th><th>Notes</th></tr></thead>
                <tbody>
                  ${reviews
                    .map(
                      (review) => `
                        <tr>
                          <td>${escapeHtml(review.checkpoint)}</td>
                          <td>${escapeHtml(review.status)}</td>
                          <td>${escapeHtml((review.tags || []).join(', '))}</td>
                          <td>${escapeHtml(review.notes || '')}</td>
                        </tr>
                      `,
                    )
                    .join('')}
                </tbody>
              </table>`;
        return `
          ${reviewRows}
          <form id="checkpoint-review-form">
            <div class="form-row">
              <label>
                <div class="label">Checkpoint</div>
                <select name="checkpoint">
                  ${checkpointOptions.map((name) => option(name, selected)).join('')}
                </select>
              </label>
              <label>
                <div class="label">Status</div>
                <select name="status">
                  ${option('unreviewed')}
                  ${option('good')}
                  ${option('mixed')}
                  ${option('bad')}
                  ${option('exported')}
                </select>
              </label>
            </div>
            <label>
              <div class="label">Notes</div>
              <textarea name="notes"></textarea>
            </label>
            <div class="form-row">
              <label>
                <div class="label">Tags, comma separated</div>
                <input name="tags" />
              </label>
              <label>
                <div class="label">Video path</div>
                <input name="video_path" />
              </label>
            </div>
            <div class="form-actions">
              <button type="submit">Save Checkpoint Review</button>
            </div>
          </form>
        `;
      }

      function bindObservationForms(runId) {
        const observationForm = document.getElementById('run-observation-form');
        if (observationForm) {
          observationForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const form = new FormData(observationForm);
            await postJson('/api/run-observation', {
              run_id: runId,
              verdict: form.get('verdict'),
              summary: form.get('summary'),
              tags: splitTags(form.get('tags')),
              recommended_checkpoint: form.get('recommended_checkpoint'),
            });
            await loadRunDetail(runId);
          });
        }
        const reviewForm = document.getElementById('checkpoint-review-form');
        if (reviewForm) {
          reviewForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const form = new FormData(reviewForm);
            await postJson('/api/checkpoint-review', {
              run_id: runId,
              checkpoint: form.get('checkpoint'),
              status: form.get('status'),
              notes: form.get('notes'),
              tags: splitTags(form.get('tags')),
              video_path: form.get('video_path'),
            });
            await loadRunDetail(runId);
          });
        }
      }

      function lineageTable(parents, children) {
        const rows = [
          ...parents.map((edge) => ['parent', edge.parent_run_id, edge.relationship, edge.intended_change]),
          ...children.map((edge) => ['child', edge.child_run_id, edge.relationship, edge.intended_change]),
        ];
        if (rows.length === 0) return `<div class="empty">No lineage links recorded.</div>`;
        return `
          <table>
            <thead><tr><th>Direction</th><th>Run</th><th>Type</th><th>Change</th></tr></thead>
            <tbody>
              ${rows
                .map(
                  ([direction, runId, type, change]) => `
                    <tr>
                      <td>${escapeHtml(direction)}</td>
                      <td>${escapeHtml(runId)}</td>
                      <td>${escapeHtml(type)}</td>
                      <td>${escapeHtml(change || '')}</td>
                    </tr>
                  `,
                )
                .join('')}
            </tbody>
          </table>
        `;
      }

      function formatTimestamp(value) {
        if (!value) return '';
        return new Date(value * 1000).toLocaleString();
      }

      function option(value, selected) {
        const isSelected = value === selected ? ' selected' : '';
        return `<option value="${escapeHtml(value)}"${isSelected}>${escapeHtml(value)}</option>`;
      }

      function splitTags(value) {
        return String(value || '')
          .split(',')
          .map((tag) => tag.trim())
          .filter(Boolean);
      }

      async function postJson(url, payload) {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!response.ok) {
          throw new Error(`Request failed: ${response.status}`);
        }
        return response.json();
      }

      function formatNumber(value) {
        if (value === null || value === undefined) return '';
        return Number(value).toPrecision(5);
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      loadRuns().catch((error) => {
        runTableBody.innerHTML = `<tr><td colspan="4" class="empty">${escapeHtml(error.message)}</td></tr>`;
      });
    </script>
  </body>
</html>
